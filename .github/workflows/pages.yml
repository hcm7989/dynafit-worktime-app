name: 앱 화면 배포 (GitHub Pages)

# main에 화면 코드가 바뀌면 https://hcm7989.github.io/dynafit-worktime-app/ 로 배포합니다.
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 합니다.
on:
  push:
    branches: [main]
    paths:
      - 'Index.html'
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp Index.html _site/index.html
          cp app/* _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
