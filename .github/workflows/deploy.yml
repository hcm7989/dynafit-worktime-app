name: Apps Script 배포

# main 브랜치에 앱 코드가 바뀌면 Apps Script로 올리고, 기존 웹 앱 배포를 새 버전으로 갱신합니다.
# 폰에서 쓰는 웹 앱 주소는 바뀌지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'Index.html'
      - 'appsscript.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - name: 시크릿 확인
        id: check
        run: |
          missing=""
          [ -z "$CLASPRC_JSON" ] && missing="$missing CLASPRC_JSON"
          [ -z "$SCRIPT_ID" ] && missing="$missing SCRIPT_ID"
          [ -z "$DEPLOYMENT_ID" ] && missing="$missing DEPLOYMENT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::다음 시크릿이 없어 배포를 건너뜁니다:$missing (README의 '자동 배포 설정' 참고)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: clasp 설치
        if: steps.check.outputs.ready == 'true'
        run: npm install -g @google/clasp@2.4.2

      - name: clasp 인증 정보 준비
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json

      - name: Apps Script로 코드 올리기
        if: steps.check.outputs.ready == 'true'
        run: clasp push --force

      - name: 웹 앱 배포를 새 버전으로 갱신
        if: steps.check.outputs.ready == 'true'
        run: |
          desc="GitHub $(echo "$GITHUB_SHA" | cut -c1-7) $(date -u +%Y-%m-%dT%H:%MZ)"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$desc"

      - name: 인증 정보 지우기
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
